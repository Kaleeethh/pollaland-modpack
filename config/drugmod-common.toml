
[efectos]
	#Mareo al consumir (como el mod original)
	nausea = true
	#Particulas de humo al fumar
	smoke = true

[adiccion]
	#Sistema de adiccion y abstinencia
	addiction = true
	#Sistema de sobredosis
	overdose = true
	#Horas reales sin consumir para que empiece la abstinencia (marihuana, alcohol y MDMA tardan el doble)
	#Range: 0.05 ~ 48.0
	withdrawalHours = 1.0
	#En creativo no hay adiccion, abstinencia ni sobredosis (para probar cosas)
	creativeExempt = true
	#Si es true, una sobredosis GRAVE mata si nadie te salva a tiempo: cuando te pasas mucho de la dosis, cuando lo que tomaste era de mala calidad (pureza < 60%), con fentanilo, o si repites sobredosis en menos de 30 min. Si es false, nunca mata (te deja a medio corazon).
	lethalOverdose = true
	#Avisar en el chat a jugadores cercanos cuando alguien tiene una sobredosis (para medicos/policias del roleplay)
	announceOverdose = true
	#Probabilidad de que una jeringa de heroina venga adulterada con fentanilo
	#Range: 0.0 ~ 1.0
	fentanylLacedChance = 0.12
	#Sonidos falsos (paranoia de la meta, alucinaciones del LSD/hongos)
	hallucinations = true

[laboratorio]
	#MODO SIMPLE: la mesa de quimica solo junta recetas. Sin temperatura que importe, sin pureza (siempre 85%), sin explosiones ni humos toxicos.
	simpleMode = false
	#Si sobrecalientas la mesa, puede explotar (solo en modo completo)
	explosions = true
	#La pureza cambia cuanto duran los efectos (y si esta muy cortada, te sienta mal)
	purityMatters = true

