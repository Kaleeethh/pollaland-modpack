# EveryCompat: Just Enough Wood Mod configuration file
# This file defines removal rules for specific block types and registry entries.
# Values for 'remove-wood-type' and 'remove-leave-type' support regular expressions or plank/leave block id.
# 'remove-entry' only accepts exact registry names (no regex).
# Lines follow the format: modid=name
# Leave a value empty to disable that rule.
remove-wood-type=forestry:.*fireproof.*
remove-leave-type=
remove-entry=mcwstairs:platform
whitelist-entry=
