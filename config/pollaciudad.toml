#Copias de seguridad de los datos de los mods de Pollaland (plata, bancos, gobierno, empresas…), en <mundo>/pollaciudad_backups. Se ven y se restauran en PollaOS Admin › Copias de seguridad
[copiasDeSeguridad]
	#1 = copias automáticas (cada día del juego y antes de los eventos grandes); 0 = solo las que haga un admin
	#Range: 0 ~ 1
	copiasActivadas = 1
	#Cada cuántos días del juego se hace la copia diaria
	#Range: 1 ~ 365
	copiaCadaDiasDelJuego = 1
	#Si el día del juego no avanza (ciclo de día apagado), igual se hace una copia diaria cada tantas horas reales
	#Range: 1 ~ 168
	copiaCadaHorasReales = 2
