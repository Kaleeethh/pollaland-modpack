	#Pensión de exalcaldes: % del sueldo del rango Alcalde (por defecto $500 en /sueldos; si se quita o queda en 0, se usa el monto fijo de abajo)
	#Range: 0.0 ~ 100.0
	pensionPorcentajeSueldo = 50.0
