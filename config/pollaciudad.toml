	minutosEntreSucesos = 150

#Seguridad: hackeos a las empresas que guardan datos (tarjetas, cuentas, contraseñas de PC)
[seguridad]
	#Cada cuántos días reales (en promedio) hackean a una empresa (nunca dos veces seguidas a la misma)
	#Range: 1 ~ 365
	diasEntreHackeos = 3

