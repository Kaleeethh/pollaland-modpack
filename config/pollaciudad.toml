	mandatoConCalendario = true
	#Sub-estación de las elecciones automáticas (0-2 primavera, 3-5 verano, 6-8 otoño, 9-11 invierno; 4 = mitad del verano, MID_SUMMER)
	#Range: 0 ~ 11
