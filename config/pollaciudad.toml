	#¿Se sigue el medio ambiente? (los admins también pueden con /ambiente activar|desactivar)
	activado = true
	#¿Salen noticias, publicaciones de PollaTok y peticiones del Quejódromo sobre el ambiente? (máx. una nota cada 3 horas)
	noticias = true
	#Bloques que contaminan (peso positivo) o dan energía limpia (negativo): "mod:bloque=peso", "mod:*=peso" o "*palabra*=peso" (palabra completa del nombre: *oil* cuenta crude_oil_pump pero no toilet). Hornos y quemadores solo cuentan encendidos. Al arrancar, el log dice cuáles bloques de este modpack coinciden
	bloques = ["minecraft:furnace=0.5", "minecraft:blast_furnace=1", "minecraft:smoker=0.4", "minecraft:campfire=0.15", "minecraft:soul_campfire=0.15", "create:blaze_burner=1.5", "create:steam_engine=3", "create:windmill_bearing=-2", "create:water_wheel=-1", "create:large_water_wheel=-2", "create:mechanical_drill=2", "*pumpjack*=6", "*fracking*=6", "*derrick*=5", "*oil_rig*=6", "*refinery*=5", "*crude*=3", "*oil*=2", "*petroleum*=3", "*diesel*=4", "*combustion*=3", "*generator*=2", "*coke_oven*=3", "*smelter*=2", "*smeltery*=2", "*incinerator*=3", "*furnace*=0.5", "*quarry*=4", "*excavator*=3", "*miner*=3", "*mining*=2", "*borer*=3", "*digger*=2", "*drill*=2", "*extractor*=1.5", "*pump*=0.5", "*solar*=-1.5", "*windmill*=-2", "*wind_turbine*=-2"]
	#Palabras que NO contaminan aunque coincidan con una palabra clave (lámparas, tubos, tanques…)
	excluir = ["lamp", "lantern", "candle", "torch", "sign", "slab", "stairs", "wall", "fence", "door", "trapdoor", "pipe", "cable", "barrel", "tank", "canister", "bucket", "bottle", "jar", "painting", "poster", "item", "ore"]
	#Troncos netos por semana que no le preocupan a nadie (talar para construir es normal)
	#Range: 0.0 ~ 1000000.0
	toleranciaTalaSemana = 300.0
	#Cuántos troncos vale romper una rama de Dynamic Trees (un golpe tumba casi todo el árbol)
	#Range: 0.1 ~ 100.0
	troncosPorRama = 4.0

#Democracia: mandato del alcalde, elecciones automáticas (si la Constitución las trae), pensión de exalcaldes, compra de votos y de prensa, revocatoria y consultas populares
