
#Banco de Pollaland
[banco]
	#Billetes y monedas que acepta el banco: item=valor
	efectivo = ["pollacoins:silver_pollacoin=1", "pollacoins:gold_pollacoin=10", "pollacoins:emerald_pollacoin=50", "pollacoins:diamond_pollacoin=100", "pollacoins:netherite_pollacoin=500"]
	#Monedas que el banco rechaza (contrabando)
	contrabando = ["kaleth_roleplay:chimbocoin_bronce", "kaleth_roleplay:chimbocoin_plata", "kaleth_roleplay:chimbocoin_oro", "kaleth_roleplay:chimbocoin_quemada"]
	#Bono de bienvenida al abrir la cuenta en un cajero
	#Range: 0 ~ 9223372036854775807
	bonoBienvenida = 20
	#Apuesta máxima en los retos de los juegos en línea del PC (Triqui, Cuatro en línea, Pong, Damas, Ajedrez, Batalla Naval); 0 = solo amistosos
	#Range: 0 ~ 1000000000
	apuestaMaximaJuegos = 1000
	#Pagos en datáfonos sin PIN (tapeando la tarjeta) hasta este monto; más que eso pide insertar la tarjeta y el PIN
	#Range: 0 ~ 9223372036854775807
	limiteSinPin = 500

#Sueldos: se pagan desde la Plata del Gobierno cada X minutos jugados
[sueldos]
	#Cada cuantos minutos conectado se cobra el sueldo (0 = sin sueldos)
	#Range: 0 ~ 1440
	cadaMinutos = 60
	#Sueldo por rango (Pollaland Rangos) o rol (Kaleth Roleplay): nombre=monto
	porRango = ["Miembro=50", "Policía=300", "policia=300", "juez=400", "Alcalde=500", "Moderador=200", "Médico=300", "Admin=0"]

#Inmobiliaria
[inmobiliaria]
	#Comisión (%) que se lleva el Estado cuando un jugador le vende a otro
	#Range: 0 ~ 100
	comision = 5
	#Impuesto a la propiedad (% del precio) que se cobra a los dueños cada periodo
	#Range: 0.0 ~ 100.0
	impuesto = 0.5
	#Duración de un periodo de alquiler / impuestos, en horas reales (168 = 1 semana)
	#Range: 1 ~ 8760
	periodoHoras = 168
	#Si WorldGuard está instalado, cada propiedad crea su región (si no, el mod protege las propiedades por su cuenta)
	usarWorldGuard = true

#Celular
[celular]
	#Rangos que reciben las llamadas al 123 de la policía (además del rol policía/juez de Kaleth Roleplay)
	rangosPolicia = ["Policía", "Policia"]
	#Rangos que reciben las llamadas al 911 (ambulancia)
	rangosMedicos = ["Médico", "Medico", "Doctor", "Paramédico"]
	#Precio en la tienda PollaTel por un número nuevo al azar
	#Range: 0 ~ 9223372036854775807
	precioNumeroNuevo = 25
	#Precio en la tienda PollaTel por elegir tu propio número
	#Range: 0 ~ 9223372036854775807
	precioNumeroPersonalizado = 150
	#Segundos que suena una llamada antes de quedar como perdida
	#Range: 5 ~ 120
	segundosTimbre = 30
	#Si Simple Voice Chat está instalado, las llamadas crean un grupo de voz privado entre los dos
	llamadasDeVoz = true

#Bolsa de Valores de Pollaland (los impuestos se cambian en el juego con /impuestos)
[bolsa]
	#Crear las empresas del mundo basadas en los mods instalados (Create, Farmer's Delight, etc.)
	empresasDelMundo = true
	#Cada cuántos segundos se mueven los precios
	#Range: 10 ~ 3600
	segundosPorMovimiento = 120
	#Probabilidad de que salga una noticia en cada movimiento (0 a 1)
	#Range: 0.0 ~ 1.0
	probabilidadNoticia = 0.25
	#Cada cuántas horas reales pagan dividendos las empresas del mundo
	#Range: 1 ~ 720
	horasDividendos = 2
	#Lo que cuesta registrar una empresa (se devuelve si la rechazan)
	#Range: 0 ~ 9223372036854775807
	registroEmpresa = 5000
	#Rangos que pueden ser la Superintendencia Financiera (además de los OP)
	rangosRegulador = ["Admin", "Regulador"]

#Banca: tarjetas de crédito, bancos de jugadores, inflación y divisas
[banca]
	#Rangos que son agentes del Banco de Pollaland (entregan tarjetas de crédito), además de los OP
	rangosBanquero = ["Banquero", "Admin"]
	#Licencia para abrir un banco (se devuelve si lo rechazan)
	#Range: 0 ~ 9223372036854775807
	licenciaBanco = 20000
	#Capital mínimo que hay que meter al abrir un banco
	#Range: 0 ~ 9223372036854775807
	capitalMinimoBanco = 50000
	#Máximo por CDT en el Banco de Pollaland (los intereses los paga su reserva)
	#Range: 100 ~ 9223372036854775807
	maximoCdtNacional = 1000000
	#Horas reales entre extractos de las tarjetas de crédito (y duración de un periodo de CDT)
	#Range: 1 ~ 720
	horasExtracto = 24
	#Cada cuántos minutos se recalcula la inflación
	#Range: 1 ~ 1440
	minutosInflacion = 30
	#Cada cuántas horas reales se gira la nómina de los contratos de trabajo
	#Range: 1 ~ 720
	horasNomina = 24
	#true = impuestos, bolsa, crédito, divisas y sueldos públicos funcionan desde el día 1. false = cada parte se prende con /economia (ya o programada)
	economiaActivaDesdeElInicio = false

#Cripto (Bitpolla): minería con rigs, billeteras y la red
[cripto]
	#Cada cuántos minutos reales sale un bloque de la red
	#Range: 1 ~ 120
	minutosPorBloque = 10
	#Recompensa inicial por bloque, en Bitpolla
	#Range: 1.0E-4 ~ 1000.0
	recompensaInicial = 0.04
	#Cada cuántos bloques la recompensa se parte a la mitad (432 = 3 días con bloques de 10 min)
	#Range: 1 ~ 1000000
	bloquesPorHalving = 432
	#Potencia de los 'mineros del mundo' (MH/s): así siempre salen bloques aunque nadie mine
	#Range: 0.1 ~ 1.0E9
	hashrateDelMundo = 20.0
	#Cada cuántos bloques la red se vuelve el doble de difícil (los mineros del mundo crecen). 0 = nunca
	#Range: 0 ~ 1000000
	bloquesParaDoblarDificultad = 288
	#Rigs por persona que minan a la vez (los demás quedan quietos)
	#Range: 1 ~ 100
	rigsMaximosPorPersona = 6

#Marcas y entretenimiento
[lanzamientos]
	#Cada cuántas horas reales una marca saca un producto nuevo (celulares, audífonos, piezas de PC)
	#Range: 1 ~ 720
	horasEntreLanzamientos = 24
	#Cada cuántas horas reales sale una novela nueva en Nalgaflix
	#Range: 1 ~ 720
	horasEntreNovelas = 48
	#Cada cuántos días reales sale una actualización de cada sistema de celular (iPollaOS, One Polla UI, HuevOS…)
